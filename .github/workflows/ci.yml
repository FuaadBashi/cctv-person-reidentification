name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ruff==0.15.8 pytest numpy
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      # The tests cover geometry and identity logic, which need only numpy; the model
      # dependencies in requirements.txt are not installed in CI.
      - name: Test
        run: pytest -q
